[tool]
id = "com.outofthewhale.booklight"
label = "Book Light"
versionCode = 1
versionName = "0.1.0"
# INTERNET and CAMERA are both for the transfer route: the tool scans a QR of the
# desktop's LAN address and pulls converted books down over Wi-Fi. Reading itself
# needs no network at all.
permissions = ["android.permission.INTERNET", "android.permission.CAMERA"]
capabilities = []
# Switch to "com.lightos" to run on real Light Phone III hardware.
serverPackage = "com.thelightphone.sdk.emulator"
